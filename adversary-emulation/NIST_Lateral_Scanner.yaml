 e8017c46-acb8-400c-a4b5-b3362b5b5baa:
  name:  Network Interface Configuration
  tactic:  discovery
  technique_name:  "System Network Configuration Discovery"
  technique_id:  T1016
  executors: 
   - sh:
     platform: darwin
     command: |
       sudo ifconfig
   - sh:
     platform: linux
     command: |
       sudo ifconfig
   - psh:
     platform: windows
     command: |
       ipconfig
 ade7be51b815cbf8908ec931256374b6:
  name:  Remote System Discovery - arp nix
  tactic:  discovery
  technique_name:  "Remote System Discovery"
  technique_id:  T1018
  executors: 
   - sh:
     platform: darwin
     command: |
       if [ -x "$(command -v arp)" ]; then : ; else (which yum && yum -y install net-tools)||(which apt-get && apt-get install -y net-tools); fi;   arp -a | grep -v '^?'
   - sh:
     platform: linux
     command: |
       if [ -x "$(command -v arp)" ]; then : ; else (which yum && yum -y install net-tools)||(which apt-get && apt-get install -y net-tools); fi;    arp -a | grep -v '^?'
 f489321f31b6ef36304294562d3d4645:
  name:  Remote System Discovery - ip neighbour
  tactic:  discovery
  technique_name:  "Remote System Discovery"
  technique_id:  T1018
  executors: 
   - sh:
     platform: linux
     command: |
       if [ -x "$(command -v ip)" ]; then : ; else apt-get install iproute2 -y; fi;   ip neighbour show
 bf4dc95d64c15935ed1db8c98bb21133:
  name:  Remote System Discovery - ping sweep
  tactic:  discovery
  technique_name:  "Remote System Discovery"
  technique_id:  T1018
  executors: 
   - sh:
     platform: linux
     command: |
       for i in $(seq 1 254); do ping -c 1 -W 1 172.16.9.$i >/dev/null 2>&1 & done; sleep 2
